<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Discipline">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0b">
<title>Discipline</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0a0a0b;
  --surface:#141415;
  --surface2:#1b1b1d;
  --line:#2a2a2c;
  --red:#e2222d;
  --red-deep:#7a1017;
  --red-dim:#3a1215;
  --green:#2fae57;
  --text:#f1efec;
  --text-dim:#9a9694;
  --text-faint:#5c5958;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:radial-gradient(ellipse at 50% -10%, #1a1010 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:60px;
}
.wrap{max-width:640px; margin:0 auto; padding:24px 16px 0;}

.brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
.brand-mark{width:14px; height:14px; background:var(--red); transform:rotate(45deg); flex-shrink:0;}
.brand-name{font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; letter-spacing:2px; text-transform:uppercase;}
.brand-name span{color:var(--red);}

.tabs{display:flex; gap:2px; margin-bottom:22px; background:var(--surface2); border-radius:10px; padding:4px;}
.tab-btn{flex:1; border:none; background:transparent; color:var(--text-dim); font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; font-size:13px; padding:12px 0; border-radius:8px; cursor:pointer; transition:background .15s, color .15s;}
.tab-btn.active{background:var(--red); color:#1a0405;}

.view{display:none;}
.view.active{display:block;}

.section-label{font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--text-faint); margin-bottom:12px;}
.section-label.rest-label{margin-top:4px;}

.day-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(46px,1fr)); gap:6px; margin-bottom:20px;}
.day-cell{
  position:relative; aspect-ratio:1/1; background:var(--surface); border:1px solid var(--line);
  border-radius:7px; cursor:pointer; padding:5px 4px 6px; display:flex; flex-direction:column;
  justify-content:space-between; transition:border-color .15s, background .15s;
}
.day-cell:hover{border-color:var(--red-deep);}
.day-cell.current{border-color:var(--text-dim);}
.day-cell.selected{border-color:var(--red); box-shadow:0 0 0 1px var(--red);}
.day-cell.complete{background:linear-gradient(160deg, var(--red-dim), var(--surface) 70%);}
.day-cell.finish{border-color:var(--green); background:linear-gradient(160deg, #123420, var(--surface) 70%);}
.day-cell.finish.selected{box-shadow:0 0 0 1px var(--green);}
.day-cell.rest{opacity:0.22; cursor:default; background:var(--surface2); border-style:dashed; align-items:center; justify-content:center;}
.day-cell.rest:hover{border-color:var(--line);}
.day-cell.rest .day-num{color:var(--text-faint);}
.day-num{font-family:'Oswald',sans-serif; font-size:13px; font-weight:600;}
.day-bar{width:100%; height:3px; background:var(--line); border-radius:2px; overflow:hidden;}
.day-bar-fill{height:100%; background:var(--red);}
.stamp{position:absolute; top:-5px; right:-5px; width:16px; height:16px; border-radius:50%; background:var(--red); color:#1a0405; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; transform:rotate(-10deg); border:2px solid var(--bg);}
.esb-badge{width:22px !important; height:22px !important; top:-8px !important; right:-8px !important; transform:none !important;}
.beer-badge{position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; font-size:11px; transform:rotate(-10deg); border:2px solid var(--bg);}

.day-detail{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px;}
.day-detail h3{font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:1px; text-transform:uppercase; margin-bottom:14px; color:var(--text-dim);}
.weight-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0 15px; border-bottom:1px solid var(--line); margin-bottom:4px;}
.weight-row label{font-size:14.5px; font-weight:500;}
.weight-input-wrap{display:flex; align-items:center; gap:6px;}
.weight-input-wrap input{width:80px; background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px; font-size:14px; text-align:right;}
.weight-input-wrap input:focus{outline:none; border-color:var(--red);}
.weight-input-wrap span{font-size:12.5px; color:var(--text-faint);}
.check-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer; user-select:none;}
.check-row:last-child{border-bottom:none;}
.check-box{width:20px; height:20px; border-radius:5px; border:1.5px solid var(--text-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#1a0405; transition:background .1s, border-color .1s;}
.check-row.checked .check-box{background:var(--red); border-color:var(--red);}
.check-label{font-size:14.5px; font-weight:500;}
.check-row.checked .check-label{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--text-faint);}

.day-picker{display:flex; gap:6px; margin-bottom:20px;}
.day-pick-btn{flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text-dim); border-radius:8px; padding:14px 10px; cursor:pointer; text-align:center; font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase;}
.day-pick-btn.active{border-color:var(--red); background:var(--red-dim); color:var(--text);}

.session-head{margin-bottom:14px;}
.session-head .title{font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; letter-spacing:1px; text-transform:uppercase;}

.ex-card{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--red-deep); border-radius:8px; margin-bottom:10px; overflow:hidden;}
.ex-head{padding:13px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;}
.ex-name{font-weight:600; font-size:14.5px;}
.ex-target{font-size:12px; color:var(--text-faint); margin-top:2px;}
.ex-last{font-size:12px; color:var(--text-dim); margin-top:4px;}
.ex-head-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.icon-btn{background:transparent; border:none; color:var(--text-faint); cursor:pointer; padding:4px; font-size:15px; line-height:1;}
.icon-btn:hover{color:var(--red);}
.ex-chevron{color:var(--text-faint); transition:transform .15s;}
.ex-card.open .ex-chevron{transform:rotate(180deg);}
.ex-body{display:none; padding:0 14px 14px;}
.ex-card.open .ex-body{display:block;}
.set-row{display:grid; grid-template-columns:28px 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px;}
.set-row .set-num{font-size:12px; color:var(--text-faint); font-weight:600;}
.set-row input{background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px; font-size:14px; width:100%;}
.set-row input:focus{outline:none; border-color:var(--red);}
.ex-actions{display:flex; gap:8px; margin-top:10px;}
.btn-ghost, .btn-red{border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:600; padding:9px 12px; cursor:pointer;}
.btn-red{background:var(--red); border-color:var(--red); color:#1a0405;}
.btn-danger{color:var(--red); border-color:var(--red-deep);}
.saved-flash{font-size:12px; color:var(--red); margin-top:8px;}

.ex-edit-form{padding:14px;}
.ef-row{margin-bottom:10px;}
.ef-row label{display:block; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;}
.ef-row input{width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px; font-size:14px;}
.ef-row input:focus{outline:none; border-color:var(--red);}
.ef-split{display:flex; gap:10px;}
.ef-split > div{flex:1;}

.add-ex-btn{width:100%; background:var(--surface); border:1px dashed var(--line); color:var(--text-dim); border-radius:8px; padding:12px; cursor:pointer; font-size:13px; font-weight:600; margin-top:4px;}
.add-ex-btn:hover{border-color:var(--red); color:var(--red);}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">disci<span>pline</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="daily">Daily</button>
    <button class="tab-btn" data-tab="lifts">Lifts</button>
  </div>

  <div class="view active" id="view-daily">
    <div id="day-grid-wrap"></div>
    <div class="day-detail" id="day-detail"></div>
  </div>

  <div class="view" id="view-lifts">
    <div class="day-picker" id="day-picker"></div>
    <div id="session-panel"></div>
  </div>

</div>

<script>
/* ---------- Program schedule (fixed dates) ---------- */
const SEGMENTS = [
  {type:'cycle', cycle:1, start:'2026-10-07', days:42},   // Day 1 = Oct 7, Day 42 = Nov 17
  {type:'rest',  start:'2026-11-18', days:6, label:'Rest, Nov 18 to 23'},
  {type:'cycle', cycle:2, start:'2026-11-24', days:12}    // Nov 24 to Dec 5
];

const CHECK_ITEMS = [
  {key:'noBreakfast', label:'No breakfast/good breakfast'},
  {key:'lunch', label:'1 healthy lunch'},
  {key:'dinner', label:'1 healthy dinner'},
  {key:'workout1', label:'Workout 1'},
  {key:'workout2', label:'Workout 2'},
  {key:'water', label:'Full water'}
];

const DEFAULT_PLAN = {
  push:{title:'Push', exercises:[
    {id:'push-1', name:'Barbell bench press', sets:4, reps:'5–8'},
    {id:'push-2', name:'Standing barbell overhead press', sets:4, reps:'6–8'},
    {id:'push-3', name:'Incline dumbbell press', sets:3, reps:'8–10'},
    {id:'push-4', name:'Dumbbell lateral raises', sets:4, reps:'12–15'},
    {id:'push-5', name:'Dumbbell skull crushers', sets:3, reps:'10–12'},
    {id:'push-6', name:'Dumbbell overhead tricep extension', sets:3, reps:'12–15'}
  ]},
  pull:{title:'Pull', exercises:[
    {id:'pull-1', name:'Barbell bent over row', sets:4, reps:'6–8'},
    {id:'pull-2', name:'One-arm dumbbell row', sets:4, reps:'8–10'},
    {id:'pull-3', name:'Barbell Romanian deadlift', sets:3, reps:'8'},
    {id:'pull-4', name:'Dumbbell rear delt fly', sets:4, reps:'12–15'},
    {id:'pull-5', name:'Barbell curl', sets:3, reps:'8–10'},
    {id:'pull-6', name:'Hammer curl', sets:3, reps:'10–12'}
  ]},
  legs:{title:'Legs', exercises:[
    {id:'legs-1', name:'Barbell back squat', sets:4, reps:'6–8'},
    {id:'legs-2', name:'Romanian deadlift', sets:4, reps:'8–10'},
    {id:'legs-3', name:'Bulgarian split squat', sets:3, reps:'10 each leg'},
    {id:'legs-4', name:'Dumbbell walking lunge', sets:3, reps:'12 each leg'},
    {id:'legs-5', name:'Dumbbell calf raise', sets:5, reps:'15–20'},
    {id:'legs-6', name:'Goblet squat burnout', sets:2, reps:'20'}
  ]}
};
const LIFT_ORDER = ['push','pull','legs'];

// Empire State Building silhouette for the very last day
const ESB_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="#04140a" aria-label="Empire State Building"><rect x="11.5" y="0.5" width="1" height="4.5"/><rect x="10.5" y="5" width="3" height="2.5"/><rect x="9" y="7.5" width="6" height="3"/><rect x="7.5" y="10.5" width="9" height="3.5"/><rect x="5.5" y="14" width="13" height="9"/></svg>';

/* ---------- Helpers ---------- */
function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, n){
  const p = dateStr.split('-').map(Number);
  return fmtDate(new Date(p[0], p[1]-1, p[2]+n));
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Build every cell of the program
const CELLS = [];
const CELL_BY_DATE = {};
SEGMENTS.forEach((seg, si)=>{
  for(let i=0;i<seg.days;i++){
    const date = addDays(seg.start, i);
    const cell = {
      date, seg:si, kind:seg.type, cycle:seg.cycle || 0,
      n:i+1, isLast:(i === seg.days-1)
    };
    CELLS.push(cell);
    CELL_BY_DATE[date] = cell;
  }
});

function dayLabelForCell(cell){
  if(!cell || cell.kind !== 'cycle') return '';
  return cell.cycle === 1 ? 'Day ' + cell.n : 'Cycle 2, Day ' + cell.n;
}
function dayLabelForDate(dateStr){
  const cell = CELL_BY_DATE[dateStr];
  if(cell && cell.kind === 'cycle') return dayLabelForCell(cell);
  const p = dateStr.split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('en-AU',{day:'numeric', month:'short'});
}

function defaultSelectedDate(){
  const today = fmtDate(new Date());
  const dayCells = CELLS.filter(c=>c.kind==='cycle');
  let pick = dayCells[0];
  dayCells.forEach(c=>{ if(c.date <= today) pick = c; });
  return pick.date;
}

/* ---------- State and storage (own keys, separate from any older version) ---------- */
let state = { checklist:{}, logs:{}, plan:null };
let selectedDate = defaultSelectedDate();
let selectedLift = 'push';
let openExerciseId = null;
let editingExId = null;
let flashExId = null;

function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

function loadData(){
  const c = lsGet('disc2-checklist');
  if(c){ try{ state.checklist = JSON.parse(c); }catch(e){} }
  const l = lsGet('disc2-logs');
  if(l){ try{ state.logs = JSON.parse(l); }catch(e){} }
  const p = lsGet('disc2-plan');
  if(p){ try{ state.plan = JSON.parse(p); }catch(e){} }
  if(!state.plan || !state.plan.push || !state.plan.pull || !state.plan.legs){
    state.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
    savePlan();
  }
}
function saveChecklist(){ lsSet('disc2-checklist', JSON.stringify(state.checklist)); }
function saveLogs(){ lsSet('disc2-logs', JSON.stringify(state.logs)); }
function savePlan(){ lsSet('disc2-plan', JSON.stringify(state.plan)); }

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------- Daily tab ---------- */
function completedCount(dateStr){
  const c = state.checklist[dateStr];
  if(!c) return 0;
  return CHECK_ITEMS.reduce((n,item)=> n + (c[item.key] ? 1 : 0), 0);
}

function renderDayGrid(){
  const wrap = document.getElementById('day-grid-wrap');
  wrap.innerHTML = '';
  const todayStr = fmtDate(new Date());

  SEGMENTS.forEach((seg, si)=>{
    const label = document.createElement('div');
    label.className = 'section-label' + (seg.type==='rest' ? ' rest-label' : '');
    if(seg.type === 'cycle'){
      label.textContent = 'Cycle ' + seg.cycle + ': Day 1 to ' + seg.days;
    }else{
      label.textContent = seg.label;
    }
    wrap.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'day-grid';

    CELLS.filter(c=>c.seg===si).forEach(cell=>{
      const el = document.createElement('div');

      if(cell.kind === 'rest'){
        el.className = 'day-cell rest';
        el.innerHTML = '<div class="day-num">–</div>';
        grid.appendChild(el);
        return;
      }

      const c = completedCount(cell.date);
      const pct = Math.round((c/CHECK_ITEMS.length)*100);
      const finish = cell.isLast;
      el.className = 'day-cell'
        + (cell.date===todayStr ? ' current' : '')
        + (cell.date===selectedDate ? ' selected' : '')
        + (c===CHECK_ITEMS.length ? ' complete' : '')
        + (finish ? ' finish' : '');
      el.innerHTML = `
        <div class="day-num">${cell.n}</div>
        <div class="day-bar"><div class="day-bar-fill" style="width:${pct}%"></div></div>
        ${cell === CELLS[CELLS.length-1] ? '<div class="beer-badge esb-badge">' + ESB_SVG + '</div>' : (finish ? '<div class="beer-badge">&#127866;</div>' : (c===CHECK_ITEMS.length ? '<div class="stamp">&#10003;</div>' : ''))}
      `;
      el.addEventListener('click', ()=>{
        selectedDate = cell.date;
        renderDayGrid();
        renderDayDetail();
      });
      grid.appendChild(el);
    });

    wrap.appendChild(grid);
  });
}

function renderDayDetail(){
  const panel = document.getElementById('day-detail');
  const cell = CELL_BY_DATE[selectedDate];
  if(!state.checklist[selectedDate]) state.checklist[selectedDate] = {};
  const c = state.checklist[selectedDate];

  const weightRow = `<div class="weight-row">
      <label>Morning weight</label>
      <div class="weight-input-wrap">
        <input type="number" inputmode="decimal" step="0.1" id="weight-input" value="${c.weight !== undefined ? esc(c.weight) : ''}" placeholder="--">
        <span>kg</span>
      </div>
    </div>`;

  panel.innerHTML = `<h3>${esc(dayLabelForCell(cell))}</h3>` + weightRow + CHECK_ITEMS.map(item=>`
    <div class="check-row${c[item.key]?' checked':''}" data-key="${item.key}">
      <div class="check-box">${c[item.key]?'&#10003;':''}</div>
      <div class="check-label">${item.label}</div>
    </div>
  `).join('');

  panel.querySelectorAll('.check-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const key = row.dataset.key;
      c[key] = !c[key];
      saveChecklist();
      renderDayDetail();
      renderDayGrid();
    });
  });

  const weightInput = panel.querySelector('#weight-input');
  weightInput.addEventListener('change', ()=>{
    const v = weightInput.value.trim();
    if(v === ''){ delete c.weight; }
    else{ c.weight = Number(v); }
    saveChecklist();
  });
}

/* ---------- Lifts tab ---------- */
function renderDayPicker(){
  const el = document.getElementById('day-picker');
  el.innerHTML = LIFT_ORDER.map(key=>`
    <button class="day-pick-btn${key===selectedLift?' active':''}" data-lift="${key}">${esc(state.plan[key].title)}</button>
  `).join('');
  el.querySelectorAll('.day-pick-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedLift = btn.dataset.lift;
      openExerciseId = null;
      editingExId = null;
      flashExId = null;
      renderDayPicker();
      renderSession();
    });
  });
}

function entriesFor(exId){
  return (state.logs[exId] || []).slice().sort((a,b)=> a.date < b.date ? 1 : -1);
}
function summarizeSets(sets){
  return sets.map(s=> `${s.weight}kg×${s.reps}`).join(', ');
}

function renderSession(){
  const plan = state.plan[selectedLift];
  const panel = document.getElementById('session-panel');
  const todayStr = fmtDate(new Date());

  const head = `<div class="session-head"><div class="title">${esc(plan.title)}</div></div>`;

  const cards = plan.exercises.map(ex=>{
    const exId = ex.id;
    const history = entriesFor(exId);
    const previous = history.find(e=> e.date < todayStr);
    const todayEntry = history.find(e=> e.date === todayStr);
    const lastLabel = previous
      ? 'Last (' + dayLabelForDate(previous.date) + '): ' + summarizeSets(previous.sets)
      : 'No history yet';
    const isOpen = openExerciseId === exId;
    const isEditing = editingExId === exId;

    if(isEditing){
      return `<div class="ex-card open" data-exid="${esc(exId)}">
        <div class="ex-edit-form">
          <div class="ef-row">
            <label>Exercise name</label>
            <input class="ef-name" value="${esc(ex.name)}">
          </div>
          <div class="ef-split">
            <div class="ef-row">
              <label>Sets</label>
              <input class="ef-sets" type="number" min="1" value="${esc(ex.sets)}">
            </div>
            <div class="ef-row">
              <label>Reps</label>
              <input class="ef-reps" value="${esc(ex.reps)}">
            </div>
          </div>
          <div class="ex-actions">
            <button class="btn-red" data-action="save-edit">Save</button>
            <button class="btn-ghost" data-action="cancel-edit">Cancel</button>
            <button class="btn-ghost btn-danger" data-action="delete-ex">Delete</button>
          </div>
        </div>
      </div>`;
    }

    const inputRows = Array.from({length:ex.sets}).map((_,i)=>{
      const s = todayEntry && todayEntry.sets[i];
      return `<div class="set-row">
        <div class="set-num">${i+1}</div>
        <input type="number" inputmode="decimal" placeholder="kg" data-role="weight" value="${s ? esc(s.weight) : ''}">
        <input type="number" inputmode="numeric" placeholder="reps" data-role="reps" value="${s ? esc(s.reps) : ''}">
      </div>`;
    }).join('');

    return `<div class="ex-card${isOpen?' open':''}" data-exid="${esc(exId)}">
      <div class="ex-head">
        <div>
          <div class="ex-name">${esc(ex.name)}</div>
          <div class="ex-target">${esc(ex.sets)} sets × ${esc(ex.reps)}</div>
          <div class="ex-last">${esc(lastLabel)}</div>
        </div>
        <div class="ex-head-right">
          <button class="icon-btn" data-action="edit-ex" aria-label="Edit exercise">&#9998;</button>
          <div class="ex-chevron">&#9662;</div>
        </div>
      </div>
      <div class="ex-body">
        ${inputRows}
        <div class="ex-actions">
          <button class="btn-red" data-action="save">Save today's sets</button>
        </div>
        ${flashExId===exId ? '<div class="saved-flash">Saved</div>' : ''}
      </div>
    </div>`;
  }).join('');

  panel.innerHTML = head + cards + '<button class="add-ex-btn" id="add-ex-btn">+ Add exercise</button>';

  panel.querySelectorAll('.ex-card').forEach(card=>{
    const exId = card.dataset.exid;

    if(card.querySelector('.ex-edit-form')){
      card.querySelector('[data-action="save-edit"]').addEventListener('click', ()=>{
        const nameVal = card.querySelector('.ef-name').value.trim();
        const setsVal = Math.max(1, Number(card.querySelector('.ef-sets').value) || 1);
        const repsVal = card.querySelector('.ef-reps').value.trim();
        if(!nameVal) return;
        const arr = state.plan[selectedLift].exercises;
        const idx = arr.findIndex(e=>e.id===exId);
        if(idx > -1){
          arr[idx].name = nameVal;
          arr[idx].sets = setsVal;
          arr[idx].reps = repsVal;
        }
        editingExId = null;
        savePlan();
        renderSession();
      });
      card.querySelector('[data-action="cancel-edit"]').addEventListener('click', ()=>{
        const arr = state.plan[selectedLift].exercises;
        const found = arr.find(e=>e.id===exId);
        if(found && found.name === 'New exercise' && found.reps === ''){
          state.plan[selectedLift].exercises = arr.filter(e=>e.id!==exId);
          savePlan();
        }
        editingExId = null;
        renderSession();
      });
      card.querySelector('[data-action="delete-ex"]').addEventListener('click', ()=>{
        state.plan[selectedLift].exercises = state.plan[selectedLift].exercises.filter(e=>e.id!==exId);
        editingExId = null;
        savePlan();
        renderSession();
      });
      return;
    }

    card.querySelector('.ex-head').addEventListener('click', (e)=>{
      if(e.target.closest('[data-action="edit-ex"]')) return;
      openExerciseId = (openExerciseId === exId) ? null : exId;
      flashExId = null;
      renderSession();
    });
    card.querySelector('[data-action="edit-ex"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      editingExId = exId;
      openExerciseId = null;
      renderSession();
    });
    card.querySelector('[data-action="save"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      const weightInputs = card.querySelectorAll('input[data-role="weight"]');
      const repInputs = card.querySelectorAll('input[data-role="reps"]');
      const sets = [];
      weightInputs.forEach((wi,i)=>{
        const w = wi.value.trim();
        const r = repInputs[i].value.trim();
        if(w !== '' && r !== ''){
          sets.push({weight:Number(w), reps:Number(r)});
        }
      });
      if(sets.length === 0) return;
      if(!state.logs[exId]) state.logs[exId] = [];
      state.logs[exId] = state.logs[exId].filter(entry=> entry.date !== todayStr);
      state.logs[exId].push({date:todayStr, sets});
      saveLogs();
      openExerciseId = exId;
      flashExId = exId;
      renderSession();
    });
  });

  document.getElementById('add-ex-btn').addEventListener('click', ()=>{
    const newId = selectedLift + '-' + Date.now();
    state.plan[selectedLift].exercises.push({id:newId, name:'New exercise', sets:3, reps:''});
    editingExId = newId;
    openExerciseId = null;
    savePlan();
    renderSession();
  });
}

/* ---------- Init ---------- */
loadData();
renderDayGrid();
renderDayDetail();
renderDayPicker();
renderSession();
</script>
</body>
</html>
